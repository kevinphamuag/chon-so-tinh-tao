name: Cập nhật kết quả và đăng app

on:
  schedule:
    # GitHub hay chạy lịch trễ hoặc bỏ lượt, nên đặt dày: mỗi 20 phút từ 18:20 đến 00:40 giờ Việt Nam,
    # rồi mỗi 3 tiếng. Lượt nào không có gì mới thì xong trong vài giây.
    - cron: "20,40 11 * * *"
    - cron: "*/20 12-17 * * *"
    - cron: "10 */3 * * *"
  push:
    branches: [main]
  repository_dispatch:
    types: [ticket]   # Phím tắt trên iPhone gửi tin nhắn vé 9969 tới đây
  workflow_dispatch:
    inputs:
      probe:
        description: "Kiểm tra mọi nguồn dữ liệu"
        type: boolean
        default: false
      test_notify:
        description: "Gửi thử thông báo lên điện thoại"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # each ticket message gets its own group so a busy update run never cancels it
  group: ${{ github.event_name == 'repository_dispatch' && format('ticket-{0}', github.run_id) || 'update-and-deploy' }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Lưu vé từ tin nhắn
        if: github.event_name == 'repository_dispatch'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TICKETS_KEY: ${{ secrets.TICKETS_KEY }}
        run: python3 scripts/tickets.py add
      - name: Lấy kết quả mới
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          TICKETS_KEY: ${{ secrets.TICKETS_KEY }}
        run: python3 scripts/update.py ${{ inputs.probe && '--probe' || '' }} ${{ inputs.test_notify && '--test-notify' || '' }}
      - name: Lưu dữ liệu mới
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then echo "Không có gì mới."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Cập nhật kết quả $(TZ=Asia/Ho_Chi_Minh date +%d/%m/%Y)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && exit 0; sleep 5; done; exit 1

  deploy:
    needs: update
    if: github.event_name != 'repository_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Đánh dấu phiên bản
        run: |
          v=$(sha1sum index.html | cut -c1-10)
          sed -i "s/__BUILD__/$v/" index.html
          echo "{\"v\":\"$v\"}" > version.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
