<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EDF0F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E131B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="Chọn Số">
<meta name="description" content="Chọn số Vietlott Mega 6/45 và Power 6/55: thống kê, kiểm chứng, xác suất thật và trợ lý AI.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Chọn Số Tỉnh Táo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
[hidden] { display: none !important; }
/* Layout: one phone-width column; sticky game switch on top, tab bar fixed at the bottom */
:root {
  --bg: #EDF0F4; --surface: #FFFFFF; --surface-2: #F5F7FA; --ink: #172033; --muted: #5B6578;
  --line: #D8DDE6; --bar: #B9C2D0;
  --mega: #1D5FA8; --mega-soft: #E2ECF8; --power: #B3322A; --power-soft: #F8E5E3; --on-game: #FFFFFF;
  --gold: #D9962B; --gold-soft: #FBF0DC; --gold-ink: #6B4708;
  --good: #1E7A4C; --good-soft: #E0F2E8; --warn: #9A5A00; --warn-soft: #FBEFD9;
  --game: var(--mega); --game-soft: var(--mega-soft);
  --font: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E131B; --surface: #161D28; --surface-2: #1D2532; --ink: #E6EAF1; --muted: #98A2B4;
    --line: #29323F; --bar: #3C4758;
    --mega: #72A9EE; --mega-soft: #19283D; --power: #EF8277; --power-soft: #351D1C; --on-game: #0E131B;
    --gold: #F0B550; --gold-soft: #33280F; --gold-ink: #F6D9A0;
    --good: #62C893; --good-soft: #142C20; --warn: #F0AA4D; --warn-soft: #32250E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E131B; --surface: #161D28; --surface-2: #1D2532; --ink: #E6EAF1; --muted: #98A2B4;
  --line: #29323F; --bar: #3C4758;
  --mega: #72A9EE; --mega-soft: #19283D; --power: #EF8277; --power-soft: #351D1C; --on-game: #0E131B;
  --gold: #F0B550; --gold-soft: #33280F; --gold-ink: #F6D9A0;
  --good: #62C893; --good-soft: #142C20; --warn: #F0AA4D; --warn-soft: #32250E;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5; }
body[data-game="655"] { --game: var(--power); --game-soft: var(--power-soft); }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--game); outline-offset: 2px; }

.app { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 0 calc(88px + env(safe-area-inset-bottom, 0px)); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 12px 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font-weight: 800; font-size: 17px; letter-spacing: -0.01em; }
.brand small { display: block; font-weight: 500; font-size: 12px; color: var(--muted); letter-spacing: 0; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 999px; font-weight: 600; font-size: 13px; color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--game); color: var(--on-game); }
.seg.game button[data-g="645"][aria-pressed="true"] { background: var(--mega); }
.seg.game button[data-g="655"][aria-pressed="true"] { background: var(--power); }

.stack { display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.card h2 { font-size: 16px; font-weight: 700; margin: 0 0 4px; text-wrap: balance; }
.card h3 { font-size: 13px; font-weight: 700; margin: 0; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.lead { color: var(--muted); font-size: 14px; margin: 0; }
.p { margin: 0; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.between { justify-content: space-between; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }

/* Latest draw */
.latest { background: var(--game-soft); border-color: transparent; }
.latest .meta { font-size: 13px; color: var(--muted); }
.latest .meta b { color: var(--ink); font-weight: 600; }
.balls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.ball { width: 36px; height: 36px; border-radius: 50%; display: inline-grid; place-items: center; font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; background: var(--game); color: var(--on-game); flex: none; }
.ball.sm { width: 30px; height: 30px; font-size: 13px; }
.ball.bonus { background: var(--gold); color: #fff; }
:root[data-theme="dark"] .ball.bonus { color: #0E131B; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .ball.bonus { color: #0E131B; } }
.ball.ghost { background: var(--surface-2); color: var(--muted); }
.ball.miss { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }
.plus { color: var(--muted); font-weight: 600; padding-inline: 2px; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 14px; font-weight: 600; font-size: 14px; }
.btn.primary { background: var(--game); border-color: var(--game); color: var(--on-game); padding: 12px 18px; font-size: 15px; }
.btn.ghost { background: transparent; }
.btn.sm { padding: 6px 10px; font-size: 13px; border-radius: 8px; }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.danger { color: var(--power); }

.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--power-soft); color: var(--power); }
.chip.neutral { background: var(--surface-2); color: var(--muted); }
.chip.bought { background: var(--good); color: var(--bg); font-size: 14px; font-weight: 700; padding: 4px 12px; }

.note { background: var(--gold-soft); color: var(--gold-ink); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; }
.note b { font-weight: 700; }

.ticket { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding-block: 10px; border-top: 1px dashed var(--line); }
.ticket:first-child { border-top: 0; padding-top: 0; }
.ticket .side { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.grid { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 6px; }
body[data-game="655"] .grid { grid-template-columns: repeat(10, minmax(0, 1fr)); }
.cell { aspect-ratio: 1; max-width: 100%; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; font-size: 13px; font-variant-numeric: tabular-nums; padding: 0; display: grid; place-items: center; }
.cell[aria-pressed="true"] { background: var(--game); border-color: var(--game); color: var(--on-game); }
.cell:disabled { opacity: 0.35; cursor: default; }
.reasons { margin: 0; padding-left: 18px; font-size: 14px; }
.reasons li + li { margin-top: 2px; }

/* AI chat */
.chat { display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 92%; padding: 10px 13px; border-radius: 14px; font-size: 14.5px; overflow-wrap: anywhere; }
.msg.user { align-self: flex-end; background: var(--game); color: var(--on-game); border-bottom-right-radius: 4px; white-space: pre-wrap; }
.msg.ai { align-self: flex-start; background: var(--surface-2); border-bottom-left-radius: 4px; }
.msg.ai p { margin: 0; } .msg.ai p + p, .msg.ai ul + p, .msg.ai p + ul { margin-top: 8px; }
.msg.ai ul { margin: 0; padding-left: 18px; }
.msg.err { align-self: stretch; background: var(--power-soft); color: var(--power); font-size: 13.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 12px; font-size: 13px; font-weight: 600; color: var(--ink); text-align: left; }
.composer { display: flex; gap: 8px; align-items: flex-end; }
.composer textarea { flex: 1; min-width: 0; resize: none; border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 10px 12px; font: inherit; font-size: 16px; color: var(--ink); min-height: 44px; max-height: 140px; }
.dots::after { content: "…"; animation: none; }
ol.steps { margin: 0; padding-left: 20px; font-size: 14px; } ol.steps li + li { margin-top: 4px; }

/* Charts */
.chart-wrap { overflow-x: auto; margin-inline: -4px; }
.chart { display: block; width: 100%; min-width: 320px; height: auto; }
.chart text { fill: var(--muted); font-size: 10px; font-family: var(--font); font-variant-numeric: tabular-nums; }
.chart .grid-l { stroke: var(--line); stroke-width: 1; }
.chart .band { fill: var(--game-soft); }
.chart .exp { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
.chart .bar { fill: var(--bar); }
.chart .bar.hi { fill: var(--game); }
.chart .bar.lo { fill: var(--gold); }
.chart .bar.sel { fill: var(--ink); }
.chart .hit { fill: transparent; cursor: pointer; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

.numlist { display: flex; flex-wrap: wrap; gap: 8px; }
.numitem { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 36px; }

.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 8px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; white-space: normal; }
th { font-size: 12px; font-weight: 600; color: var(--muted); }
tr.theory td { color: var(--muted); font-style: italic; }
td .sub { display: block; font-size: 12px; color: var(--muted); font-style: normal; }

.hbar { display: grid; grid-template-columns: minmax(0, 9em) 1fr auto; gap: 8px; align-items: center; font-size: 13px; }
.hbar .track { height: 10px; background: var(--surface-2); border-radius: 6px; overflow: hidden; }
.hbar .fill { height: 100%; background: var(--game); border-radius: 6px; }
.hbar .fill.theory { background: var(--bar); }

.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.stat .k { font-size: 12px; color: var(--muted); }
.stat .v { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

label.fld { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 500; min-width: 0; }
.fld input, .fld select { border: 1px solid var(--line); background: var(--surface-2); border-radius: 9px; padding: 9px 10px; font-size: 15px; color: var(--ink); width: 100%; font-variant-numeric: tabular-nums; }
.fields { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 420px) { .fields { grid-template-columns: 1fr 1fr; } }

details.more summary { cursor: pointer; font-size: 14px; font-weight: 600; color: var(--game); }
details.more[open] summary { margin-bottom: 8px; }

.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); }
.tabbar button { border: 0; background: transparent; padding: 8px 0 9px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10.5px; white-space: nowrap; font-weight: 600; color: var(--muted); }
.tabbar svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabbar button[aria-current="page"] { color: var(--game); }
.badge { background: var(--game); color: var(--on-game); border-radius: 999px; font-size: 10px; padding: 0 5px; margin-left: 2px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; z-index: 9; max-width: calc(100% - 32px); text-align: center; }
@media (prefers-reduced-motion: no-preference) {
  .pop { animation: pop .28s ease-out both; }
  @keyframes pop { from { transform: scale(.6); opacity: .3; } to { transform: none; opacity: 1; } }
}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand">Chọn Số Tỉnh Táo<small>Thống kê Vietlott, nói thật về xác suất</small></div>
    <div class="seg game" role="group" aria-label="Loại vé">
      <button type="button" data-g="645" aria-pressed="true">Mega 6/45</button>
      <button type="button" data-g="655" aria-pressed="false">Power 6/55</button>
    </div>
  </header>

  <div class="stack">
    <section class="card latest" id="latest"><p class="meta p">Đang tải dữ liệu…</p></section>
    <div id="view" class="stack"></div>
  </div>
</div>

<nav class="tabbar" aria-label="Mục">
  <div class="in">
    <button type="button" data-tab="pick"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3"/></svg>Chọn số</button>
    <button type="button" data-tab="stats"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Thống kê</button>
    <button type="button" data-tab="test"><svg viewBox="0 0 24 24"><path d="M9 3h6M10 3v6l-5.5 9.5A1.6 1.6 0 0 0 5.9 21h12.2a1.6 1.6 0 0 0 1.4-2.5L14 9V3"/><path d="M7.5 15h9"/></svg>Kiểm chứng</button>
    <button type="button" data-tab="tickets"><svg viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 0 0 4v4h18v-4a2 2 0 0 1 0-4V4H3z" transform="translate(0 2)"/><path d="M14 6v12" stroke-dasharray="2 2"/></svg><span>Vé<span id="tcount"></span></span></button>
    <button type="button" data-tab="odds"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><circle cx="8.5" cy="8.5" r="1.2"/><circle cx="15.5" cy="15.5" r="1.2"/><circle cx="15.5" cy="8.5" r="1.2"/><circle cx="8.5" cy="15.5" r="1.2"/></svg>Xác suất</button>
    <button type="button" data-tab="ai"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7-4.7-1.8 4.7-1.8z"/><path d="M18.5 15l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/></svg>Hỏi AI</button>
  </div>
</nav>
<div class="toast" id="toast" hidden></div>

<script>
(function () {
"use strict";

/* ---------- Game rules ---------- */
const PRICE = 10000;
const GAMES = {
  "645": { name: "Mega 6/45", N: 45, total: 8145060, days: [0, 3, 5], minJ: 12e9,
    prizes: [
      { name: "Jackpot", cond: "Trùng 6 số", ways: 1, jackpot: true },
      { name: "Giải nhất", cond: "Trùng 5 số", ways: 234, value: 10e6 },
      { name: "Giải nhì", cond: "Trùng 4 số", ways: 11115, value: 300e3 },
      { name: "Giải ba", cond: "Trùng 3 số", ways: 182780, value: 30e3 }
    ] },
  "655": { name: "Power 6/55", N: 55, total: 28989675, days: [2, 4, 6], minJ: 30e9,
    prizes: [
      { name: "Jackpot 1", cond: "Trùng 6 số", ways: 1, jackpot: true },
      { name: "Jackpot 2", cond: "Trùng 5 số + số đặc biệt", ways: 6, value: 3e9, note: "tối thiểu" },
      { name: "Giải nhất", cond: "Trùng 5 số", ways: 288, value: 40e6 },
      { name: "Giải nhì", cond: "Trùng 4 số", ways: 17640, value: 500e3 },
      { name: "Giải ba", cond: "Trùng 3 số", ways: 368480, value: 50e3 }
    ] }
};
const DOW = ["Chủ nhật", "Thứ Hai", "Thứ Ba", "Thứ Tư", "Thứ Năm", "Thứ Sáu", "Thứ Bảy"];

/* ---------- Data ---------- */
const BASE = { "645": [], "655": [] };
function setBase(raw) {
  for (const g of ["645", "655"]) BASE[g] = (raw[g] || []).map(r => ({ id: r[0], date: r[1], n: r.slice(2, 8), b: g === "655" ? (r[8] || null) : null }));
}
const S = {
  game: load("game", "645"), tab: load("tab", "pick"), statWin: load("statWin", "all"),
  count: Number(load("count", "3")) || 3,
  extra: { "645": [], "655": [] }, meta: null,
  generated: [], picks: [], tickets: [], ticketsReady: false, confirmDel: null,
  smsText: "", adminOpen: false, aiKey: load("aikey", ""), chat: [], aiBusy: false, aiDraft: "",
  calc: { k: 1, m: 52, j: "" }, sel: null
};
if (!GAMES[S.game]) S.game = "645";
const cache = {};
function draws(g) {
  if (cache[g]) return cache[g];
  const byId = new Map();
  for (const d of BASE[g]) byId.set(d.id, d);
  for (const d of S.extra[g]) if (!byId.has(d.id)) byId.set(d.id, d);
  return (cache[g] = [...byId.values()].sort((a, b) => a.id - b.id));
}
function invalidate() { for (const k in cache) delete cache[k]; }

/* ---------- Helpers ---------- */
function load(k, d) { try { const v = localStorage.getItem("css_" + k); return v == null ? d : v; } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem("css_" + k, v); } catch (e) {} }
const pad = n => String(n).padStart(2, "0");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => Math.round(n).toLocaleString("vi-VN");
function money(v) {
  if (v >= 1e9) return (v / 1e9).toLocaleString("vi-VN", { maximumFractionDigits: 1 }) + " tỷ";
  if (v >= 1e6) return (v / 1e6).toLocaleString("vi-VN", { maximumFractionDigits: 1 }) + " triệu";
  return fmt(v) + " đ";
}
function drawInfo(g) {
  const inf = S.meta && S.meta.info && S.meta.info[g], D = draws(g), last = D[D.length - 1];
  return inf && last && inf.id === last.id ? inf : null;
}
function currentJ(g) {
  const inf = drawInfo(g);
  if (inf && inf.winners > 0) return GAMES[g].minJ;  // won: next draw restarts from the minimum
  const v = S.meta && Number(S.meta["jackpot" + g]); return v > 0 ? v : 0;
}
function oneIn(p) { return p <= 0 ? "—" : "1 trên " + fmt(1 / p); }
function pct(p, digits) {
  if (p === 0) return "0%";
  if (p < 0.0001) return oneIn(p);
  return (p * 100).toLocaleString("vi-VN", { maximumFractionDigits: digits == null ? (p < 0.01 ? 3 : 1) : digits }) + "%";
}
function dmy(iso) { const [y, m, d] = iso.split("-"); return d + "/" + m + "/" + y; }
function dowOf(iso) { const [y, m, d] = iso.split("-").map(Number); return DOW[new Date(Date.UTC(y, m - 1, d)).getUTCDay()]; }
function ball(n, cls) { return '<span class="ball ' + (cls || "") + '">' + pad(n) + "</span>"; }
function vnNow() { const d = new Date(); return new Date(d.getTime() + (d.getTimezoneOffset() + 420) * 60000); }
function isoOf(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function nextDraw(g, from) {
  const now = from || vnNow();
  for (let i = 0; i < 8; i++) {
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i, 18, 0, 0);
    if (GAMES[g].days.includes(d.getDay()) && d > now) return d;
  }
}
function prevDraw(g) {
  const now = vnNow();
  for (let i = 0; i < 8; i++) {
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i, 18, 0, 0);
    if (GAMES[g].days.includes(d.getDay()) && d < now) return d;
  }
}
function rnd(max) { // unbiased integer in [0, max)
  const a = new Uint32Array(1), lim = Math.floor(0x100000000 / max) * max;
  do { crypto.getRandomValues(a); } while (a[0] >= lim);
  return a[0] % max;
}
function comb(n, k) { if (k < 0 || k > n) return 0; let r = 1; for (let i = 1; i <= k; i++) r = r * (n - k + i) / i; return Math.round(r); }

  clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 2200);

/* ---------- Prize logic ---------- */
function prizeFor(g, ticket, d) {
  const m = ticket.filter(x => d.n.includes(x)).length;
  const G = GAMES[g];
  if (g === "645") {
    if (m === 6) return { m, name: "Jackpot", value: G.minJ, jackpot: true };
    if (m === 5) return { m, name: "Giải nhất", value: 10e6 };
    if (m === 4) return { m, name: "Giải nhì", value: 300e3 };
    if (m === 3) return { m, name: "Giải ba", value: 30e3 };
  } else {
    if (m === 6) return { m, name: "Jackpot 1", value: G.minJ, jackpot: true };
    if (m === 5 && d.b && ticket.includes(d.b)) return { m, name: "Jackpot 2", value: 3e9, j2: true };
    if (m === 5) return { m, name: "Giải nhất", value: 40e6 };
    if (m === 4) return { m, name: "Giải nhì", value: 500e3 };
    if (m === 3) return { m, name: "Giải ba", value: 50e3 };
  }
  return { m, name: null, value: 0 };
}
const afterTax = v => v > 10e6 ? v - 0.1 * (v - 10e6) : v;
function ev(g, J, taxed) {
  const G = GAMES[g], f = taxed ? afterTax : (v => v);
  let s = 0;
  for (const p of G.prizes) s += p.ways * f(p.jackpot ? J : p.value);
  return s / G.total;
}
function nonJackpotEV(g, taxed) {
  const G = GAMES[g], f = taxed ? afterTax : (v => v);
  let s = 0;
  for (const p of G.prizes) if (!p.jackpot) s += p.ways * f(p.value);
  return s / G.total;
}

/* ---------- Popularity of a combination ---------- */
const LUCKY = [6, 8, 9, 38, 39];
function popularity(g, nums) {
  const s = [...nums].sort((a, b) => a - b), R = [];
  let score = 0;
  const le31 = s.filter(x => x <= 31).length;
  if (le31 === 6) { score += 30; R.push("Cả 6 số đều ≤ 31: rất nhiều người chọn theo ngày sinh, ngày kỷ niệm."); }
  else if (le31 === 5) { score += 10; R.push("5 trên 6 số ≤ 31: hơi giống bộ số ngày tháng."); }
  const d = s[1] - s[0];
  if (s.every((x, i) => i === 0 || x - s[i - 1] === d)) { score += 40; R.push("Các số cách đều nhau (dãy " + d + "): kiểu chọn theo hình, rất phổ biến."); }
  else {
    let run = 1, maxRun = 1;
    for (let i = 1; i < 6; i++) { run = s[i] === s[i - 1] + 1 ? run + 1 : 1; maxRun = Math.max(maxRun, run); }
    if (maxRun >= 3) { score += maxRun >= 4 ? 25 : 10; R.push("Có " + maxRun + " số liên tiếp."); }
  }
  for (let k = 2; k <= 10; k++) if (s.every(x => x % k === 0)) { score += 25; R.push("Đều là bội số của " + k + "."); break; }
  const tail = {}; for (const x of s) tail[x % 10] = (tail[x % 10] || 0) + 1;
  const maxTail = Math.max(...Object.values(tail));
  if (maxTail >= 3) { score += maxTail >= 4 ? 20 : 8; R.push(maxTail + " số có cùng chữ số cuối."); }
  if (s[5] - s[0] <= 15) { score += 12; R.push("Các số dồn vào một khoảng hẹp (" + pad(s[0]) + "–" + pad(s[5]) + ")."); }
  const lucky = s.filter(x => LUCKY.includes(x)).length;
  if (lucky >= 3) { score += 12; R.push("Nhiều số được coi là may mắn (6, 8, 9, 38, 39)."); }
  const D = draws(g), last = D[D.length - 1];
  const key = s.join(",");
  if (D.some(dr => [...dr.n].sort((a, b) => a - b).join(",") === key)) { score += 40; R.push("Trùng hệt một bộ số đã từng trúng: nhiều người chơi lại các bộ này."); }
  else if (last) {
    const ov = s.filter(x => last.n.includes(x)).length;
    if (ov >= 3) { score += 15; R.push("Trùng " + ov + " số với kỳ vừa quay: nhiều người chép kết quả kỳ trước."); }
  }
  score = Math.min(100, score);
  const level = score === 0 ? "good" : score <= 20 ? "neutral" : score <= 40 ? "warn" : "bad";
  const label = score === 0 ? "Ít người chọn" : score <= 20 ? "Bình thường" : score <= 40 ? "Khá phổ biến" : "Rất phổ biến";
  return { score, level, label, reasons: R };
}
function generate(g, count) {
  const N = GAMES[g].N, out = [];
  for (let t = 0; t < count; t++) {
    let best = null;
    for (let tries = 0; tries < 4000; tries++) {
      const pool = Array.from({ length: N }, (_, i) => i + 1), pick = [];
      for (let i = 0; i < 6; i++) pick.push(pool.splice(rnd(pool.length), 1)[0]);
      pick.sort((a, b) => a - b);
      if (out.some(o => o.filter(x => pick.includes(x)).length > 2)) continue;
      if (popularity(g, pick).score === 0) { best = pick; break; }
      if (!best) best = pick;
    }
    out.push(best);
  }
  return out;
}

/* ---------- Statistics ---------- */
function freqStats(g, win) {
  const D = draws(g), N = GAMES[g].N;
  const W = win === "all" ? D.length : Math.min(D.length, Number(win));
  const slice = D.slice(D.length - W);
  const f = new Array(N + 1).fill(0);
  for (const d of slice) for (const x of d.n) f[x]++;
  const gap = new Array(N + 1).fill(D.length);
  for (let i = D.length - 1; i >= 0; i--) for (const x of D[i].n) if (gap[x] === D.length) gap[x] = D.length - 1 - i;
  const p = 6 / N, E = W * p, sd = Math.sqrt(W * p * (1 - p));
  let ss = 0; for (let x = 1; x <= N; x++) ss += (f[x] - E) ** 2;
  const chi = ss / (W * p * (1 - p)) * (N - 1) / N;
  const pval = gammq((N - 1) / 2, chi / 2);
  return { W, f, gap, E, sd, chi, pval, N };
}
function gammln(xx) {
  const c = [76.18009172947146, -86.50532032941677, 24.01409824083091, -1.231739572450155, 0.1208650973866179e-2, -0.5395239384953e-5];
  let x = xx, y = xx, tmp = x + 5.5; tmp -= (x + 0.5) * Math.log(tmp);
  let ser = 1.000000000190015; for (const v of c) ser += v / ++y;
  return -tmp + Math.log(2.5066282746310005 * ser / x);
}
function gammq(a, x) {
  if (x <= 0) return 1;
  if (x < a + 1) {
    let ap = a, sum = 1 / a, del = sum;
    for (let n = 0; n < 500; n++) { ap++; del *= x / ap; sum += del; if (Math.abs(del) < Math.abs(sum) * 1e-13) break; }
    return 1 - sum * Math.exp(-x + a * Math.log(x) - gammln(a));
  }
  let b = x + 1 - a, c = 1e300, d = 1 / b, h = d;
  for (let i = 1; i < 500; i++) {
    const an = -i * (i - a); b += 2;
    d = an * d + b; if (Math.abs(d) < 1e-300) d = 1e-300;
    c = b + an / c; if (Math.abs(c) < 1e-300) c = 1e-300;
    d = 1 / d; const del = d * c; h *= del; if (Math.abs(del - 1) < 1e-13) break;
  }
  return Math.exp(-x + a * Math.log(x) - gammln(a)) * h;
}

/* ---------- Backtest ---------- */
const STRATS = [
  { key: "hot", name: "Số nóng", desc: "6 số ra nhiều nhất trong 50 kỳ trước" },
  { key: "cold", name: "Số lạnh", desc: "6 số ra ít nhất trong 50 kỳ trước" },
  { key: "gap", name: "Số lâu chưa ra", desc: "6 số vắng mặt lâu nhất" },
  { key: "repeat", name: "Chép kỳ trước", desc: "Mua lại đúng 6 số vừa ra" }
];
function backtest(g) {
  if (cache["bt" + g]) return cache["bt" + g];
  const D = draws(g), N = GAMES[g].N, W = 50;
  const res = STRATS.map(s => Object.assign({}, s, { hist: [0, 0, 0, 0, 0, 0, 0], won: 0, j2: 0 }));
  const freq = new Array(N + 1).fill(0), lastSeen = new Array(N + 1).fill(-1);
  const nums = Array.from({ length: N }, (_, i) => i + 1);
  for (let i = 0; i < D.length; i++) {
    if (i >= W) {
      const tk = {
        hot: [...nums].sort((a, b) => freq[b] - freq[a] || a - b).slice(0, 6),
        cold: [...nums].sort((a, b) => freq[a] - freq[b] || a - b).slice(0, 6),
        gap: [...nums].sort((a, b) => lastSeen[a] - lastSeen[b] || a - b).slice(0, 6),
        repeat: D[i - 1].n
      };
      for (const r of res) {
        const pz = prizeFor(g, tk[r.key], D[i]);
        r.hist[pz.m]++; if (pz.jackpot || pz.j2) r.j2++; else r.won += pz.value;
      }
    }
    for (const x of D[i].n) { freq[x]++; lastSeen[x] = i; }
    if (i >= W) for (const x of D[i - W].n) freq[x]--;
  }
  const T = Math.max(0, D.length - W);
  const theory = [0, 1, 2, 3, 4, 5, 6].map(k => T * comb(6, k) * comb(N - 6, 6 - k) / GAMES[g].total);
  return (cache["bt" + g] = { res, T, theory, theoryReturn: GAMES[g].prizes.filter(p => !/^Jackpot/.test(p.name)).reduce((a, p) => a + p.ways * p.value, 0) / GAMES[g].total / PRICE });
}

function pickHistory(g, sel) {

  const dist = [0, 0, 0, 0, 0, 0, 0], hits = [], near = [];
  let j2 = 0;
  for (const d of D) {
    const m = s.filter(x => d.n.includes(x)).length;
    if (m === k) hits.push(d);
    if (k === 6) { dist[m]++; if (m >= 4 && m < 6) near.push([m, d]); if (m === 5 && d.b && s.includes(d.b)) j2++; }
  }
  const expect = D.length * comb(N - k, 6 - k) / comb(N, 6);
  let h = '<div class="stack" style="gap:10px;border-top:1px dashed var(--line);padding-top:12px"><h3>Lịch sử trong ' + fmt(D.length) + " kỳ</h3>";

    h += hits.length ? '<p class="p"><b>Bộ này đã ra nguyên bộ ' + hits.length + " lần</b> (trúng Jackpot).</p>" : '<p class="p">Bộ này <b>chưa từng ra nguyên bộ</b> lần nào.</p>';
    h += '<div class="stats" style="grid-template-columns:repeat(3,minmax(0,1fr))">' +
      '<div class="stat"><div class="k">Trùng 5 số</div><div class="v">' + dist[5] + "</div></div>" +
      '<div class="stat"><div class="k">Trùng 4 số</div><div class="v">' + dist[4] + "</div></div>" +
      '<div class="stat"><div class="k">Trùng 3 số</div><div class="v">' + dist[3] + "</div></div></div>";
    if (g === "655" && j2) h += '<p class="small p">Trong đó ' + j2 + " lần trùng 5 số kèm số đặc biệt (Jackpot 2).</p>";

function chartSVG(st) {
  const N = st.N, L = 30, R = 6, T = 8, B = 22, bw = 10, VW = L + R + N * bw, VH = 190, ph = VH - T - B;
  const maxF = Math.max(...st.f.slice(1), st.E + 2 * st.sd) * 1.06;
  const y = v => T + ph - v / maxF * ph;
  const step = niceStep(maxF / 4);
  let s = '<svg class="chart" viewBox="0 0 ' + VW + " " + VH + '" role="img" aria-label="Biểu đồ tần suất từng số">';
  for (let v = 0; v <= maxF; v += step) s += '<line class="grid-l" x1="' + L + '" x2="' + (VW - R) + '" y1="' + y(v).toFixed(1) + '" y2="' + y(v).toFixed(1) + '"/><text x="' + (L - 4) + '" y="' + (y(v) + 3).toFixed(1) + '" text-anchor="end">' + fmt(v) + "</text>";
  const lo = Math.max(0, st.E - 2 * st.sd), hiV = st.E + 2 * st.sd;
  s += '<rect class="band" x="' + L + '" width="' + (N * bw) + '" y="' + y(hiV).toFixed(1) + '" height="' + (y(lo) - y(hiV)).toFixed(1) + '"/>';
  for (let x = 1; x <= N; x++) {
    const f = st.f[x], cls = S.sel === x ? "sel" : f > hiV ? "hi" : f < st.E - 2 * st.sd ? "lo" : "";
    const bx = L + (x - 1) * bw;
    s += '<rect class="bar ' + cls + '" x="' + (bx + 1.5) + '" width="' + (bw - 3) + '" y="' + y(f).toFixed(1) + '" height="' + Math.max(0, T + ph - y(f)).toFixed(1) + '" rx="1.5"/>';
    if (x === 1 || x % 5 === 0) s += '<text x="' + (bx + bw / 2) + '" y="' + (VH - 8) + '" text-anchor="middle">' + x + "</text>";
    s += '<rect class="hit" data-sel="' + x + '" x="' + bx + '" width="' + bw + '" y="' + T + '" height="' + (ph + B) + '"><title>Số ' + pad(x) + ": " + f + " lần</title></rect>";
  }
  s += '<line class="exp" x1="' + L + '" x2="' + (VW - R) + '" y1="' + y(st.E).toFixed(1) + '" y2="' + y(st.E).toFixed(1) + '"/>';
  return s + "</svg>";
}
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw))), m = raw / p; return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * p; }
function selInfo(st) {
  if (!S.sel || S.sel > st.N) return "Chạm vào một cột để xem chi tiết từng số.";
  const x = S.sel, dev = (st.f[x] - st.E) / st.sd;
  return "Số " + pad(x) + ": ra " + st.f[x] + " lần (" + (dev >= 0 ? "+" : "") + dev.toLocaleString("vi-VN", { maximumFractionDigits: 1 }) + " độ lệch chuẩn), lần gần nhất cách đây " + st.gap[x] + " kỳ.";
}

function updateCalc() {
  const out = document.getElementById("c-out"); if (!out) return;
  const g = S.game, G = GAMES[g], c = S.calc;

    "Đã trừ thuế thu nhập 10% trên phần giải thưởng vượt 10 triệu.";
}

/* ---------- Tickets from Vietlott SMS (9969) ---------- */
function combos(arr, k) {
  const out = [], cur = [];
  (function go(i) {
    if (cur.length === k) { out.push(cur.slice()); return; }
    for (let j = i; j <= arr.length - (k - cur.length); j++) { cur.push(arr[j]); go(j + 1); cur.pop(); }
  })(0);
  return out;
}
function checkTicket(g, nums, d) {
  if (nums.length === 6) return prizeFor(g, nums, d);
  const m = nums.filter(x => d.n.includes(x)).length, count = {};
  let value = 0, jackpot = false;
  for (const c of combos(nums, 6)) {
    const p = prizeFor(g, c, d);
    if (p.value) { value += p.value; count[p.name] = (count[p.name] || 0) + 1; if (p.jackpot) jackpot = true; }
  }
  const names = Object.keys(count);
  return { m, value, jackpot, name: names.length ? names.map(n => (count[n] > 1 ? count[n] + "× " : "") + n).join(", ") : null };
}
function drawDateFor(g, ky) {

    let ky = null, date = null, code = null;
    let m = part.match(/ky\s*QSMT\s*:?\s*0*(\d{1,6})/i) || part.match(/(?:^|\s)(?:645|655)\s+[A-Z]\s+0*(\d{3,6})\b/i) || part.match(/\bky\s*:?\s*#?0*(\d{3,6})\b/i);

function mdLite(text) {
  const lines = esc(text).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").split(/\n/);
  let out = "", inList = false, para = [];
  const flush = () => { if (para.length) { out += "<p>" + para.join("<br>") + "</p>"; para = []; } };
  for (const raw of lines) {
    const l = raw.trim(), m = l.match(/^(?:[-*•]|\d+[.)])\s+(.*)$/);
    if (m) { flush(); if (!inList) { out += "<ul>"; inList = true; } out += "<li>" + m[1] + "</li>"; continue; }
    if (inList) { out += "</ul>"; inList = false; }
    if (!l) flush(); else para.push(l.replace(/^#+\s*/, ""));
  }
  flush(); if (inList) out += "</ul>";
  return out;
}

  const b = e.target.closest("button, rect.hit");
  if (!b) return;
  if (b.dataset.g) { S.game = b.dataset.g; save("game", S.game); S.generated = []; S.picks = []; S.sel = null; render(); return; }
  if (b.dataset.tab) { S.tab = b.dataset.tab; save("tab", S.tab); S.confirmDel = null; render(); window.scrollTo(0, 0); return; }
  if (b.dataset.tabGo) { S.tab = b.dataset.tabGo; save("tab", S.tab); render(); return; }
  if (b.dataset.count) { S.count = Number(b.dataset.count); save("count", String(S.count)); render(); return; }
  if (b.dataset.win) { S.statWin = b.dataset.win; save("statWin", S.statWin); render(); return; }
  if (b.dataset.sel) {
    const x = Number(b.dataset.sel); S.sel = S.sel === x ? null : x;
    const st = freqStats(S.game, S.statWin);
    document.querySelector(".chart-wrap").innerHTML = chartSVG(st);
    document.getElementById("selinfo").textContent = selInfo(st);
    return;
  }
  if (b.dataset.pick) {
    const n = Number(b.dataset.pick);
    S.picks = S.picks.includes(n) ? S.picks.filter(x => x !== n) : S.picks.length < 6 ? S.picks.concat(n) : S.picks;
    render(); return;
  }
  if (b.dataset.del) { if (S.confirmDel === b.dataset.del) deleteTicket(b.dataset.del); else { S.confirmDel = b.dataset.del; render(); } return; }
  if (b.dataset.ask) { askAI(b.dataset.ask); return; }
  const act = b.dataset.act;
  if (act === "gen") { S.generated = generate(S.game, S.count); S.justGen = true; render(); S.justGen = false; }
  else if (act === "clear") { S.picks = []; render(); }
  else if (act === "savekey") saveKey();
  else if (act === "smssave") {
    const r = importTickets(parseSMS(S.smsText));
    S.smsText = ""; render();
    toast(importMsg(r));
  }
  else if (act === "smsclear") { S.smsText = ""; render(); }
  else if (act === "smspaste") {
    (async () => {
      try { const t = await navigator.clipboard.readText(); if (t) { S.smsText = t; render(); return; } } catch (e) {}
      const ta = document.getElementById("sms-input"); if (ta) ta.focus();
      toast("Chạm giữ vào ô trống rồi chọn Dán");
    })();
  }
  else if (act === "forgetkey") { S.aiKey = ""; save("aikey", ""); save("aimodel", ""); S.chat = []; render(); }
  else if (act === "clearchat") { S.chat = []; render(); }
  else if (act === "send") { const ta = document.getElementById("ai-input"); if (ta && ta.value.trim()) askAI(ta.value.trim()); }
  else if (act === "savepick" && S.picks.length === 6) { saveTicket(S.picks); S.picks = []; }
  else if (act === "lookup") {
    const t = S.generated[Number(b.dataset.i)];
    if (t) {
      S.picks = t.slice(); render();
      const f = document.getElementById("pickform");
      if (f) f.closest("section").scrollIntoView({ behavior: "smooth", block: "start" });
    }
  }
  else if (act === "copy") {
    const t = S.generated[Number(b.dataset.i)];
    if (t) {
      const text = t.map(pad).join(" ");
      const done = () => { b.textContent = "✓ Chép"; toast("Đã sao chép " + text); };
      try {
        navigator.clipboard.writeText(text).then(done, () => { const inp = document.getElementById("pick-input"); if (inp) { inp.value = text; } toast("Không sao chép được, đã điền sẵn vào ô Dò"); });
      } catch (e) { const inp = document.getElementById("pick-input"); if (inp) inp.value = text; toast("Đã điền sẵn vào ô Dò"); }
    }
  }
  else if (act === "save") {
    const t = S.generated[Number(b.dataset.i)];
    if (t) { saveTicket(t); b.disabled = true; b.textContent = "Đã lưu"; }
  }
});
document.addEventListener("input", e => {
  const id = e.target.id;
  if (id === "sms-input") {
    S.smsText = e.target.value;
    document.getElementById("sms-preview").innerHTML = smsPreview();
    const btn = document.querySelector('[data-act="smssave"]'); if (btn) btn.disabled = !parseSMS(S.smsText).length;
    return;
  }
  if (id === "ai-input") { S.aiDraft = e.target.value; e.target.style.height = "auto"; e.target.style.height = Math.min(140, e.target.scrollHeight) + "px"; return; }
  if (id === "c-k") S.calc.k = e.target.value;
  else if (id === "c-m") S.calc.m = e.target.value;
  else if (id === "c-j") S.calc.j = e.target.value;
  else return;
  updateCalc();
});
document.addEventListener("toggle", e => { if (e.target.id === "adminbox") S.adminOpen = e.target.open; }, true);
document.addEventListener("submit", async e => {
  if (e.target.id === "pickform") {
    e.preventDefault();
    const N = GAMES[S.game].N, raw = (document.getElementById("pick-input").value.match(/\d+/g) || []).map(Number);
    const nums = [...new Set(raw.filter(x => x >= 1 && x <= N))].slice(0, 6);
    if (nums.length < 2) { toast("Nhập ít nhất 2 số từ 1 đến " + N); return; }
    if (nums.length < raw.length) toast("Đã bỏ số trùng hoặc ngoài khoảng 1–" + N);
    S.picks = nums; render();
    return;
  }
  if (e.target.id !== "addform") return;
  e.preventDefault();
  const g = S.game, N = GAMES[g].N, msg = document.getElementById("f-msg");
  const id = parseInt(document.getElementById("f-id").value, 10);
  const date = document.getElementById("f-date").value;
  const n = (document.getElementById("f-n").value.match(/\d+/g) || []).map(Number);
  const bEl = document.getElementById("f-b"), bonus = bEl ? parseInt(bEl.value, 10) : null;
  const okNums = n.length === 6 && new Set(n).size === 6 && n.every(x => x >= 1 && x <= N);
  if (!id || id < 1) { msg.textContent = "Nhập số kỳ (vd " + (draws(g).slice(-1)[0].id + 1) + ")."; return; }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { msg.textContent = "Chọn ngày quay."; return; }
  if (!okNums) { msg.textContent = "Cần đúng 6 số khác nhau từ 1 đến " + N + "."; return; }
  if (g === "655" && (!bonus || bonus < 1 || bonus > N || n.includes(bonus))) { msg.textContent = "Số đặc biệt phải từ 1 đến 55 và khác 6 số trên."; return; }
  const local = localExtra();
  local[g] = local[g].filter(d => d.id !== id).concat([{ id, date, n: n.sort((a, b) => a - b), b: g === "655" ? bonus : null }]);
  setLocalExtra(local); S.extra = local; invalidate(); render();
  toast("Đã lưu kỳ #" + id);
});

/* ---------- Start ---------- */
function localExtra() {
  try { const v = JSON.parse(localStorage.getItem("css_extra") || "{}"); return { "645": v["645"] || [], "655": v["655"] || [] }; }
  catch (e) { return { "645": [], "655": [] }; }
}
function setLocalExtra(v) { try { localStorage.setItem("css_extra", JSON.stringify(v)); } catch (e) {} }
async function getJSON(path) {
  const r = await fetch(path + "?v=" + Date.now(), { cache: "no-store" });
  if (!r.ok) throw new Error(path + " " + r.status);
  return r.json();
}
async function start() {
  S.tickets = localTickets();
  S.extra = localExtra();
  try {
    const [raw, meta] = await Promise.all([getJSON("data/draws.json"), getJSON("data/meta.json").catch(() => null)]);
    setBase(raw); S.meta = meta;
  } catch (e) {
    document.getElementById("latest").innerHTML = '<p class="p">Không tải được dữ liệu. Kiểm tra mạng rồi mở lại app.</p>';
    return;
  }
  invalidate();
  try {
    const q = new URLSearchParams(location.search).get("sms");
    if (q) {
      history.replaceState(null, "", location.pathname);
      S.tab = "tickets";
      const r = importTickets(parseSMS(q));
      render();
      toast(parseSMS(q).length ? importMsg(r) : "Không nhận ra vé trong tin nhắn");
      return;
    }
  } catch (e) {}
  render();
}
start();
})();
</script>
